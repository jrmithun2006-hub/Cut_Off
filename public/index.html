<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Cutoff - Login</title> 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"> 
  <style> 
    * { margin: 0; padding: 0; box-sizing: border-box; } 
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    } 
    .login-container { 
      background: white; 
      padding: 40px; 
      border-radius: 20px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
      width: 100%; 
      max-width: 400px; 
      text-align: center; 
    } 
    .logo { 
      font-size: 42px; 
      font-weight: 700; 
      margin-bottom: 10px; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      background-clip: text; 
      color: transparent; 
    } 
    .tagline { 
      font-size: 16px; 
      color: #666; 
      margin-bottom: 30px; 
    } 
    .login-options { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      margin-top: 20px; 
    } 
    .login-btn { 
      padding: 14px; 
      border: none; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: 500; 
      cursor: pointer; 
      transition: all 0.3s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      width: 100%; 
    } 
    .google-btn { 
      background: white; 
      border: 2px solid #ddd; 
      color: #444; 
    } 
    .google-btn:hover { 
      background: #f8f9fa; 
      border-color: #ccc; 
      transform: translateY(-2px); 
    } 
    .phone-btn { 
      background: #4F7DF9; 
      color: white; 
    } 
    .phone-btn:hover { 
      background: #3a6af5; 
      transform: translateY(-2px); 
    } 
    .error { 
      color: #dc2626; 
      margin-top: 15px; 
      font-size: 14px; 
      padding: 10px; 
      background: rgba(220, 38, 38, 0.1); 
      border-radius: 8px; 
      display: none; 
    } 
  </style> 
</head> 
<body> 
  <div class="login-container"> 
    <h1 class="logo">Cutoff</h1> 
    <p class="tagline">Your subscriptions, on your schedule</p> 
    <div id="login-options" class="login-options"> 
      <button id="googleLogin" class="login-btn google-btn"> 
        <svg width="20" height="20" viewBox="0 0 24 24"> 
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/> 
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/> 
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/> 
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/> 
        </svg> 
        Continue with Google 
      </button> 
      <button id="phoneLogin" class="login-btn phone-btn"> 
        ?? Continue with Phone (Test Mode) 
      </button> 
    </div> 
    <div id="error" class="error"></div> 
  </div> 
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script> 
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script> 
  <script src="firebase-config.js"></script> 
  <script> 
    // Check if user is already logged in 
    firebase.auth().onAuthStateChanged(function(user) { 
      if (user) { 
        window.location.href = "dashboard.html"; 
      } 
    }); 
    // Google Login 
    document.getElementById('googleLogin').onclick = function() { 
      const provider = new firebase.auth.GoogleAuthProvider(); 
      firebase.auth().signInWithPopup(provider) 
        .then(function(result) { 
          window.location.href = "dashboard.html"; 
        }) 
        .catch(function(error) { 
          document.getElementById('error').textContent = 'Google login failed: ' + error.message; 
          document.getElementById('error').style.display = 'block'; 
        }); 
    }; 
    // Phone Login (Simplified - Use test numbers) 
    document.getElementById('phoneLogin').onclick = function() { 
      document.getElementById('error').textContent = 'Phone login requires Firebase Blaze plan for SMS. Use Google login or add test numbers in Firebase Console.'; 
      document.getElementById('error').style.display = 'block'; 
    }; 
  </script> 
</body> 
</html>
