<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutoff - Login</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.6s ease-out;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .tagline {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
            font-weight: 400;
        }
        
        .login-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .google-btn {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        
        .google-btn:hover {
            background: #f8f9fa;
            border-color: #d0d0d0;
        }
        
        .email-btn {
            background: linear-gradient(135deg, #4F7DF9 0%, #3a6af5 100%);
            color: white;
        }
        
        .email-btn:hover {
            background: linear-gradient(135deg, #3a6af5 0%, #295df2 100%);
        }
        
        .signup-btn {
            background: linear-gradient(135deg, #764ba2 0%, #5d3b84 100%);
            color: white;
        }
        
        .signup-btn:hover {
            background: linear-gradient(135deg, #5d3b84 0%, #4a2d68 100%);
        }
        
        .form-container {
            display: none;
            margin-top: 25px;
            animation: slideDown 0.3s ease-out;
        }
        
        .form-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4F7DF9;
            box-shadow: 0 0 0 3px rgba(79, 125, 249, 0.15);
        }
        
        .form-group input.error {
            border-color: #dc2626;
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        
        .form-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .form-btn.primary {
            background: #4F7DF9;
            color: white;
        }
        
        .form-btn.primary:hover {
            background: #3a6af5;
        }
        
        .form-btn.secondary {
            background: #f3f4f6;
            color: #555;
            border: 1px solid #e0e0e0;
        }
        
        .form-btn.secondary:hover {
            background: #e5e7eb;
        }
        
        .message {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s;
            text-align: left;
        }
        
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .back-btn:hover {
            color: #333;
            background: #f8f9fa;
        }
        
        .loading {
            display: none;
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 25px;
            }
            
            .logo {
                font-size: 40px;
            }
            
            .form-group input {
                padding: 12px 14px;
            }
            
            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="logo">Cutoff</h1>
            <p class="tagline">Your subscriptions, on your schedule</p>
            
            <div class="login-options" id="loginOptions">
                <button id="googleLogin" class="login-btn google-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Login with Google
                </button>
                
                <button id="emailLoginBtn" class="login-btn email-btn">
                    📧 Login with Email
                </button>
                
                <button id="signupBtn" class="login-btn signup-btn">
                    ✨ Create New Account
                </button>
                
                <!-- Guest button has been REMOVED -->
            </div>
            
            <!-- Email Login Form -->
            <div class="form-container" id="emailLoginForm">
                <h3 class="form-title">Login with Email</h3>
                
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Your password">
                </div>
                
                <div class="form-actions">
                    <button id="performLogin" class="form-btn primary">
                        🔐 Sign In
                    </button>
                    <button onclick="showLoginOptions()" class="form-btn secondary">
                        Cancel
                    </button>
                </div>
            </div>
            
            <!-- Signup Form -->
            <div class="form-container" id="signupForm">
                <h3 class="form-title">Create Your Account</h3>
                
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Your name">
                </div>
                
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com">
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="At least 6 characters">
                </div>
                
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Re-enter your password">
                </div>
                
                <div class="form-actions">
                    <button id="performSignup" class="form-btn primary">
                        ✨ Create Account
                    </button>
                    <button onclick="showLoginOptions()" class="form-btn secondary">
                        Cancel
                    </button>
                </div>
            </div>
            
            <!-- Messages -->
            <div id="message" class="message"></div>
            <div id="loading" class="loading">
                <span class="spinner"></span> Processing...
            </div>
        </div>
    </div>

    <!-- ===== LOAD EMAILJS SDK ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // ===== INITIALIZE EMAILJS =====
        (function() {
            if (typeof emailjs !== 'undefined') {
                emailjs.init("bcMSvUiDIm1CPzsoa"); // Your EmailJS Public Key
                console.log("✅ EmailJS initialized in login page");
            }
        })();

        // ===== FIREBASE CONFIGURATION =====
        const firebaseConfig = {
            apiKey: "AIzaSyAjpxICETdQIvuw3mMt2pBDeOQDT10TH6U",
            authDomain: "cutoff-subscriptions.firebaseapp.com",
            databaseURL: "https://cutoff-subscriptions-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cutoff-subscriptions",
            storageBucket: "cutoff-subscriptions.firebasestorage.app",
            messagingSenderId: "239564142815",
            appId: "1:239564142815:web:44a6577763a691ba0a516a"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ===== UI MANAGEMENT =====
        function showLoginOptions() {
            document.getElementById('emailLoginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginOptions').style.display = 'flex';
            hideMessage();
        }
        
        function showEmailLogin() {
            document.getElementById('loginOptions').style.display = 'none';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('emailLoginForm').style.display = 'block';
            document.getElementById('loginEmail').focus();
            hideMessage();
        }
        
        function showSignup() {
            document.getElementById('loginOptions').style.display = 'none';
            document.getElementById('emailLoginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('signupName').focus();
            hideMessage();
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
        
        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        // ===== EVENT LISTENERS =====
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            if (localStorage.getItem('cutoff_user')) {
                window.location.href = 'dashboard.html';
                return;
            }
            
            // Setup event listeners
            document.getElementById('emailLoginBtn').addEventListener('click', showEmailLogin);
            document.getElementById('signupBtn').addEventListener('click', showSignup);
            // Guest login button REMOVED
            document.getElementById('performLogin').addEventListener('click', handleEmailLogin);
            document.getElementById('performSignup').addEventListener('click', handleSignup);
            document.getElementById('googleLogin').addEventListener('click', handleGoogleLogin);
            
            // Enter key support for forms
            document.getElementById('loginEmail').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleEmailLogin();
            });
            
            document.getElementById('loginPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleEmailLogin();
            });
            
            document.getElementById('signupName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSignup();
            });
            
            document.getElementById('signupEmail').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSignup();
            });
            
            document.getElementById('signupPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSignup();
            });
            
            document.getElementById('signupConfirmPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSignup();
            });
        });

        // ===== AUTHENTICATION HANDLERS =====
        
        // Guest Login function has been REMOVED
        
        // Email Login
        async function handleEmailLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // Validation
            if (!email || !password) {
                showMessage('Please enter both email and password', 'error');
                return;
            }
            
            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }
            
            showLoading();
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Store user info
                localStorage.setItem('cutoff_user', user.uid);
                localStorage.setItem('cutoff_email', user.email);
                localStorage.setItem('cutoff_name', user.displayName || email.split('@')[0]);
                localStorage.removeItem('cutoff_is_guest'); // Remove guest flag
                
                showMessage('Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                showMessage(getAuthErrorMessage(error), 'error');
                hideLoading();
            }
        }
        
        // Signup
        async function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            
            // Validation
            if (!name || !email || !password || !confirmPassword) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            showLoading();
            
            try {
                // Create user with email/password
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Update profile with name
                await user.updateProfile({
                    displayName: name
                });
                
                // Create user in database
                await database.ref('users/' + user.uid).set({
                    name: name,
                    email: email,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                
                // Store user info
                localStorage.setItem('cutoff_user', user.uid);
                localStorage.setItem('cutoff_email', user.email);
                localStorage.setItem('cutoff_name', name);
                localStorage.removeItem('cutoff_is_guest'); // Remove guest flag
                
                showMessage('Account created successfully! Welcome to Cutoff!', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                console.error('Signup error:', error);
                showMessage(getAuthErrorMessage(error), 'error');
                hideLoading();
            }
        }
        
        // Google Login
        async function handleGoogleLogin() {
            showLoading();
            
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Store user info
                localStorage.setItem('cutoff_user', user.uid);
                localStorage.setItem('cutoff_email', user.email);
                localStorage.setItem('cutoff_name', user.displayName || 'Google User');
                localStorage.removeItem('cutoff_is_guest'); // Remove guest flag
                
                // Create/update user in database
                await database.ref('users/' + user.uid).set({
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL,
                    isGoogleUser: true,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                
                showMessage('Google login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Google login error:', error);
                showMessage(getAuthErrorMessage(error), 'error');
                hideLoading();
            }
        }

        // ===== UTILITY FUNCTIONS =====
        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        function getAuthErrorMessage(error) {
            const errorMessages = {
                'auth/invalid-email': 'Invalid email address format',
                'auth/user-not-found': 'No account found with this email',
                'auth/wrong-password': 'Incorrect password',
                'auth/email-already-in-use': 'This email is already registered',
                'auth/weak-password': 'Password is too weak. Use at least 6 characters',
                'auth/network-request-failed': 'Network error. Please check your connection',
                'auth/popup-blocked': 'Popup blocked by browser. Please allow popups',
                'auth/popup-closed-by-user': 'Login popup was closed',
                'auth/too-many-requests': 'Too many attempts. Please try again later',
                'auth/operation-not-allowed': 'Email/password login is not enabled',
                'auth/user-disabled': 'This account has been disabled'
            };
            
            return errorMessages[error.code] || 'Authentication failed. Please try again.';
        }
    </script>
</body>
</html>
